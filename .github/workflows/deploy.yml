name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/palforzia-dose-tracker-WXhvz]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAriYpNJf14MyHYm_Dg6avuhBfZWJNVXkM
          VITE_FIREBASE_AUTH_DOMAIN: edwardpalforzia.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: edwardpalforzia
          VITE_FIREBASE_STORAGE_BUCKET: edwardpalforzia.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "998790087251"
          VITE_FIREBASE_APP_ID: "1:998790087251:web:f777171fbec846ed7f7ca6"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
